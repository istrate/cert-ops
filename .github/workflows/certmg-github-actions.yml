name: certmg-github-actions
run-name: generate certifcate
on: [push]
jobs:
  generate-certificates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./certs
    steps:
      - uses: actions/checkout@v6
      - name: Setup OpenShift CLI (oc)
        uses: redhat-actions/oc-installer@v1
        with:
          version: "latest" # You can also specify an exact version like "4.20"

      - name: Authenticate to OpenShift Cluster
        run: |
          oc login --server="${{ secrets.OPENSHIFT_SERVER }}" --token="${{ secrets.OPENSHIFT_TOKEN }}"

      - name: Generate certificates using openssl
        run: |
          chmod +x ../gen_cert.sh; ../gen_cert.sh
          
      - name: Check if files still exist around
        run: |
          ls -al 
